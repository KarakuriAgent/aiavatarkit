[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiavatar"
version = "0.8.17"
description = "Building AI-based conversational avatars"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "uezo", email = "uezo@uezo.net" },
]
maintainers = [
  { name = "uezo", email = "uezo@uezo.net" },
]
dependencies = [
  "aiofiles>=24.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "livekit-wakeword>=0.2.1",
  "numpy>=2.2.3",
  "openai>=1.55.3",
  "python-multipart>=0.0.20",
  "silero-vad>=6.0.0",
  "ten-vad>=1.0.6",
  "uvicorn>=0.30.0",
  "webrtc-noise-gain>=1.3.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
audio = [
  "PyAudio>=0.2.14",
]
cert = [
  "cryptography>=42.0.0",
]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
voice-auth = [
  "huggingface-hub[hf_xet]>=0.24.0",
  "mlx>=0.28.0",
  "torch>=2.8.0",
  "torchaudio>=2.8.0",
]
qwen-stt = [
  "mlx-qwen3-asr",
]
wakeword-training = [
  "livekit-wakeword[train,eval,export,voxcpm]>=0.2.1",
]

[project.scripts]
server = "server.server:main"
voice-auth-enroll = "server.voice_auth_enroll:main"
voice-auth-server = "voice_auth_server.server:main"
voice-auth-runtime = "provider.voice_auth.wespeaker_mlx.server:main"
wespeaker-mlx-runtime = "provider.voice_auth.wespeaker_mlx.server:main"
qwen3-asr-mlx-runtime = "provider.stt.qwen3_asr_mlx.server:main"
tenvad-runtime = "provider.vad.tenvad.server:main"
wakeword-enrollment-server = "wakeword_enrollment_server.server:main"

[project.urls]
Homepage = "https://github.com/uezo/aiavatarkit"

[tool.setuptools.packages.find]
include = ["aiavatar*", "server*", "provider*", "voice_auth_server*", "wakeword_enrollment_server*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
aiavatar = ["admin/static/*"]
server = ["html/**/*"]
voice_auth_server = ["static/*"]
wakeword_enrollment_server = ["static/*"]
