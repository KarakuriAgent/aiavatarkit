services:
  voice-auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      AIAVATAR_DB_PATH: /app/data/aiavatar.db
      VOICE_AUTH_PROVIDER: http
      VOICE_AUTH_BASE_URL: http://host.docker.internal:8765
      VOICE_AUTH_PROFILE_DIR: /app/data/voice_profiles
      VOICE_AUTH_ENROLLMENT_DIR: /app/data/voice_auth_enrollment
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./README.md:/app/README.md:ro
      - ./LICENSE:/app/LICENSE:ro
      - ./aiavatar:/app/aiavatar
      - ./server:/app/server
      - ./voice_auth_server:/app/voice_auth_server
      - ./models:/app/models
      - voice-auth-uv-venv:/app/.venv
      - uv-cache:/root/.cache/uv
      - torch-cache:/root/.cache/torch
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - sh
      - -c
      - uv sync --frozen && uv run uvicorn voice_auth_server.server:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  voice-auth-uv-venv:
  uv-cache:
  torch-cache:
  app-data:
